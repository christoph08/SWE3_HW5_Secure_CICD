name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  source-scan:
    name: Source Code Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Scan source code with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

  build-and-push:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: source-scan
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/christoph08/swe3_hw5_secure_cicd
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and publish outside pull requests)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.optimized
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max  
  
  image-security:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/christoph08/swe3_hw5_secure_cicd@${{ needs.build-and-push.outputs.image-digest }}
          format: cyclonedx
          output: sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v6
        with:
          name: docker-image-sbom
          path: sbom.cyclonedx.json
          if-no-files-found: error
          retention-days: 30

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/christoph08/swe3_hw5_secure_cicd@${{ needs.build-and-push.outputs.image-digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'


  attest:
    name: Attest SBOM
    runs-on: ubuntu-latest
    needs:
      - build-and-push
      - image-security
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download SBOM
        uses: actions/download-artifact@v7
        with:
          name: docker-image-sbom

      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/christoph08/swe3_hw5_secure_cicd
          subject-digest: ${{ needs.build-and-push.outputs.image-digest }}
          sbom-path: sbom.cyclonedx.json
          push-to-registry: true